networks:  
  monitoring:  
    driver: bridge  

volumes:  
  prometheus_data: {}  
  loki_data: {}  
  grafana_data: {}  
  alertmanager_data: {}  

services:  
  prometheus:  
    image: prom/prometheus:v3.11.3  
    container_name: prometheus  
    restart: unless-stopped  
    networks: [monitoring]  
    ports:  
      - "9090:9090"  
    volumes:  
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml  
      - ./prometheus/rules:/etc/prometheus/rules  
      - prometheus_data:/prometheus  
    command:  
      - "--config.file=/etc/prometheus/prometheus.yml"  
      - "--storage.tsdb.path=/prometheus"  
      - "--storage.tsdb.retention.time=30d"  
      - "--web.enable-lifecycle"  
      - "--web.enable-admin-api"  
      - "--web.enable-remote-write-receiver"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      alertmanager:
        condition: service_started

  loki:  
    image: grafana/loki:3.7.2  
    container_name: loki  
    restart: unless-stopped  
    networks: [monitoring]  
    ports:  
      - "3100:3100"  
    volumes:  
      - ./loki/loki-config.yml:/etc/loki/config.yml  
      - loki_data:/loki  
    command: -config.file=/etc/loki/config.yml  
    healthcheck:
      # Loki 3.6+ distroless image has no wget/shell; use built-in -health (3.7+)
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  alertmanager:  
    image: prom/alertmanager:v0.32.1  
    container_name: alertmanager  
    restart: unless-stopped  
    networks: [monitoring]  
    ports:  
      - "127.0.0.1:9093:9093"  
    env_file:
      - .env
    volumes:  
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.tmpl  
      - alertmanager_data:/alertmanager  
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat /etc/alertmanager/alertmanager.tmpl \
          | sed "s|\$${SMTP_HOST}|$$SMTP_HOST|g" \
          | sed "s|\$${SMTP_FROM}|$$SMTP_FROM|g" \
          | sed "s|\$${SMTP_PASSWORD}|$$SMTP_PASSWORD|g" \
          | sed "s|\$${ALERT_EMAIL_TO}|$$ALERT_EMAIL_TO|g" \
          > /etc/alertmanager/alertmanager.yml \
        && exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  blackbox:  
    image: prom/blackbox-exporter:v0.28.0  
    container_name: blackbox  
    restart: unless-stopped  
    networks: [monitoring]  
    ports:  
      - "127.0.0.1:9115:9115"  
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9115/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  grafana:  
    image: grafana/grafana:13.0.1-security-01  
    container_name: grafana  
    restart: unless-stopped  
    networks: [monitoring]  
    ports:  
      - "3000:3000"  
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:  
      - grafana_data:/var/lib/grafana  
      - ./grafana/provisioning:/etc/grafana/provisioning  
      - ./grafana/entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - .env
    environment:  
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}  
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}  
      - GF_USERS_ALLOW_SIGN_UP=false  
      - GF_UNIFIED_ALERTING_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

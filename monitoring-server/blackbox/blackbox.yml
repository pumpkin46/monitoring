modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      enable_http2: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

  # Used for https:// probe targets (TLS + cert expiry metrics)
  http_2xx_tls:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      enable_http2: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: false

  icmp_ping:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true

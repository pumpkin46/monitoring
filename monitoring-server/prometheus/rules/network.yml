groups:  
  - name: network  
    rules:  

      # Server down — no host metrics via remote_write for 3+ minutes
      # (agents are not Prometheus scrape targets; up == 0 does not apply)
      - alert: ServerDown
        expr: |
          (time() - max by (server) (timestamp(node_boot_time_seconds))) > 180
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Server DOWN: {{ $labels.server }}"
          description: "No host metrics from {{ $labels.server }} for 3+ minutes (Alloy remote_write stale)"

      # High network traffic (&gt; 100 MB/s receive)  
      - alert: HighNetworkReceive  
        expr: |  
          rate(node_network_receive_bytes_total{device!~"lo|docker.*"}[5m]) > 100000000  
        for: 5m  
        labels:  
          severity: warning  
        annotations:  
          summary: "High network RX on {{ $labels.server }}"  
          description: "Receiving {{ $value | humanize }}B/s on {{ $labels.device }}"  

      # High network errors  
      - alert: NetworkErrors  
        expr: |  
          rate(node_network_receive_errs_total[5m]) +   
          rate(node_network_transmit_errs_total[5m]) > 10  
        for: 5m  
        labels:  
          severity: warning  
        annotations:  
          summary: "Network errors on {{ $labels.server }}"  
          description: "{{ $value | printf \"%.1f\" }} errors/s on {{ $labels.device }}"  

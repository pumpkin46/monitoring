groups:  
  - name: disk  
    rules:  

      # Disk &gt; 80%  
      - alert: DiskSpaceWarning  
        expr: |  
          (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs"}   
                / node_filesystem_size_bytes)) * 100 &gt; 80  
        for: 5m  
        labels:  
          severity: warning  
        annotations:  
          summary: "Disk space warning on {{ $labels.server }}"  
          description: "Mount {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% full"  

      # Disk &gt; 90% — critical  
      - alert: DiskSpaceCritical  
        expr: |  
          (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs"}   
                / node_filesystem_size_bytes)) * 100 &gt; 90  
        for: 2m  
        labels:  
          severity: critical  
        annotations:  
          summary: "CRITICAL disk on {{ $labels.server }}"  
          description: "Mount {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% full"  

      # Disk will fill in &lt; 4 hours (predictive)  
      - alert: DiskWillFillSoon  
        expr: |  
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs"}[2h], 4 * 3600) &lt; 0  
        for: 30m  
        labels:  
          severity: warning  
        annotations:  
          summary: "Disk filling fast on {{ $labels.server }}"  
          description: "{{ $labels.mountpoint }} predicted to fill in &lt; 4 hours"  

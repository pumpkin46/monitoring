global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Prometheus 3.x: preserve v2 metric-name validation for node_exporter / Alloy metrics
  metric_name_validation_scheme: legacy
  external_labels:
    monitor: "central-monitoring"

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - api_version: v2
      static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Blackbox HTTP probes — one target per server (see generate-server-dashboards.py probe_url)
  - job_name: http-probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://146.190.166.199:9000/
        labels:
          server: manager
      - targets:
          - https://ota-receiver.localota.stream/healthz
        labels:
          server: receiver
      - targets:
          - http://147.182.204.142:8001/
        labels:
          server: worker
      - targets:
          - https://tools.localota.stream/health
        labels:
          server: comparison
      - targets:
          - https://gha.localota.stream
        labels:
          server: pms-api
      - targets:
          - https://scrape.localota.com/
        labels:
          server: scraper
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: "https://.*"
        target_label: __param_module
        replacement: http_2xx_tls
      - target_label: __address__
        replacement: blackbox:9115
    # Blackbox exporter must return a valid Prometheus Content-Type
    fallback_scrape_protocol: PrometheusText0.0.4

  # Uncomment if you have MySQL. Install mysqld_exporter on that server.
  # - job_name: mysql
  #   static_configs:
  #     - targets: ["DB_SERVER_IP:9104"]
  #       labels:
  #         server: db-server

  # Uncomment if you use Redis. Install redis_exporter on that server.
  # - job_name: redis
  #   static_configs:
  #     - targets: ["REDIS_IP:9121"]

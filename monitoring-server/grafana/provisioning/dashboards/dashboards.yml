apiVersion: 1

providers:
  - name: overview
    orgId: 1
    folder: Overview
    type: file
    disableDeletion: true
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/overview

  # All server dashboards live under /servers/<server>/...
  # This auto-loads everything under the servers dir (excluding overview).
  - name: servers
    orgId: 1
    folder: Servers
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/servers
      foldersFromFilesStructure: true
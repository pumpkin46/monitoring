    orgId: 1
    folder: Overview
    type: file
    disableDeletion: true
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/overview

  - name: servers
    orgId: 1
    type: file
    disableDeletion: true
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/servers
      foldersFromFilesStructure: true
